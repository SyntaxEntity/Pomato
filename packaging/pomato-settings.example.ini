# Pomato 配置模板（脱敏示例）
#
# 这是给新用户的「全部可配置项」参考，字段值**全部是占位示例**，
# 不含任何真实路径或个人信息。真正的个人备份请用你自己导出的文件。
#
# 用法：
#   1. 按需修改下面的值
#   2. 导入：dconf load /io/github/pomato/ < dist/pomato-settings.example.ini
#   3. 查看当前值：dconf dump /io/github/pomato/
#   4. 导出你自己的备份：dconf dump /io/github/pomato/ > my-pomato-settings.ini
#
# 键位完整说明见 docs/CONFIGURATION.md

[/]
# ---- 计时（分钟）----
work-minutes=uint32 25
short-break-minutes=uint32 5
long-break-minutes=uint32 15
long-break-interval=uint32 4

# ---- 行为开关 ----
auto-start-next=false
sound-enabled=true
notifications-enabled=true
close-to-tray=true
minimize-to-tray=true
show-tray-icon=true

# ---- 总目标（倒数日）----
# goal-date 格式固定为 YYYY-MM-DD；留空表示未设置目标
goal-name='项目截止'
goal-date='2026-12-31'

# ---- 全屏自定义背景 ----
# 留空 = 全屏也使用 GTK 原生背景
fullscreen-bg-path='/path/to/your/wallpaper.png'
# 遮罩不透明度 0–1
fullscreen-bg-dim=0.45
# 模糊半径 0–64 px
fullscreen-bg-blur=12.0
# 遮罩颜色，任意合法 CSS 颜色（'black' / 'white' / 'rgba(0,0,0,0.5)' …）
fullscreen-bg-color='black'
